services:
  # Qdrant 本地向量数据库（先启动）
  qdrant:
    image: qdrant/qdrant:latest
    container_name: context-keeper-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - context-keeper-network

    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # TimescaleDB/PostgreSQL 时间线存储
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: context-keeper-timescaledb
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      - POSTGRES_DB=context_keeper_timeline
      - POSTGRES_USER=${TIMESCALEDB_USERNAME:-context_keeper}
      - POSTGRES_PASSWORD=${TIMESCALEDB_PASSWORD:-context_keeper_password}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C

    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./scripts/init/timescaledb:/docker-entrypoint-initdb.d

    networks:
      - context-keeper-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALEDB_USERNAME:-context_keeper} -d context_keeper_timeline"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # Neo4j 知识图谱存储
  neo4j:
    image: neo4j:5.15-community
    container_name: context-keeper-neo4j
    restart: unless-stopped

    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt

    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-neo4j_password}
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4JLABS_PLUGINS=["apoc"]

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
      # 注释掉初始化脚本挂载，Neo4j不支持docker-entrypoint-initdb.d机制
      # - ./scripts/init/neo4j:/docker-entrypoint-initdb.d

    networks:
      - context-keeper-network

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # Context-Keeper 主应用
  context-keeper:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-latest}
        BUILD_TIME: ${BUILD_TIME:-}
        COMMIT_HASH: ${COMMIT_HASH:-}

    image: context-keeper:${VERSION:-latest}

    container_name: context-keeper

    restart: unless-stopped

    # 依赖所有数据库服务
    depends_on:
      qdrant:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      neo4j:
        condition: service_healthy

    # 🔥 NVIDIA GPU 支持（如需启用，取消下面注释）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           device_ids: ['0']
    #           capabilities: [gpu]

    # 加载 .env 文件
    env_file:
      - ./config/.env

    # 环境变量
    environment:
      - RUN_MODE=${RUN_MODE:-http}
      - HTTP_SERVER_PORT=${HTTP_SERVER_PORT:-8088}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - STORAGE_PATH=/app/data
      - TZ=${TZ:-Asia/Shanghai}
      # 认证配置
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - DEMO_AUTH_PASSWORD=${DEMO_AUTH_PASSWORD:-demo123}
      # CORS配置
      - ALLOWED_ORIGINS=http://localhost:8088,http://127.0.0.1:8088,http://localhost:8889,http://127.0.0.1:8889,http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080
      # GPU相关环境变量（仅在启用GPU时生效）
      # - CUDA_VISIBLE_DEVICES=0
      # - NVIDIA_VISIBLE_DEVICES=0
      # - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Ollama 服务地址（使用宿主机服务）
      - OLLAMA_HOST=http://host.docker.internal:11434
      # LLM 配置
      - LLM_PROVIDER=ollama_local
      - LLM_MODEL=qwen2.5:3b
      # Qdrant 服务地址（使用容器内网络）
      - QDRANT_URL=http://qdrant:6333
      - VECTOR_DB_URL=http://qdrant:6333
      # TimescaleDB 服务地址（使用容器内网络）
      - TIMESCALEDB_HOST=timescaledb
      - TIMESCALEDB_PORT=5432
      # Neo4j 服务地址（使用容器内网络）
      - NEO4J_URI=bolt://neo4j:7687

    # 端口映射
    ports:
      - "${HOST_PORT:-8088}:${HTTP_SERVER_PORT:-8088}"

    # 卷挂载
    volumes:
      - ./data:/app/data
      - ./data/logs:/app/data/logs
      - ./config:/app/config:ro
      - ./web:/app/web:ro

    # 健康检查
    healthcheck:
      test: |
        if [ "$$RUN_MODE" = "http" ]; then
          curl -f http://localhost:$${HTTP_SERVER_PORT:-8088}/health || exit 1
        else
          pgrep -f context-keeper || exit 1
        fi
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # 网络配置
    networks:
      - context-keeper-network

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

    # 添加额外的 hosts 配置（Windows Docker Desktop 兼容性）
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Ollama 本地大模型服务
  # 注释掉：使用宿主机本地的Ollama服务（通过host.docker.internal:11434访问）
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: context-keeper-ollama
  #   restart: unless-stopped
  #
  #   ports:
  #     - "11434:11434"  # Ollama API
  #
  #   volumes:
  #     - ollama_data:/root/.ollama
  #
  #   networks:
  #     - context-keeper-network
  #
  #   # 🔥 NVIDIA GPU 支持（如需启用，取消下面注释）
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           device_ids: ['0']
  #   #           capabilities: [gpu]
  #
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "100m"
  #       max-file: "2"

  # 可选：Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: context-keeper-nginx
    restart: unless-stopped
    
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    
    depends_on:
      - context-keeper
    
    networks:
      - context-keeper-network
    
    profiles:
      - proxy

  # 可选：监控服务
  prometheus:
    image: prom/prometheus:latest
    container_name: context-keeper-prometheus
    restart: unless-stopped
    
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    
    networks:
      - context-keeper-network
    
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: context-keeper-grafana
    restart: unless-stopped
    
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    
    depends_on:
      - prometheus
    
    networks:
      - context-keeper-network
    
    profiles:
      - monitoring

networks:
  context-keeper-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  qdrant_data:
  ollama_data:
  timescaledb_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins: 

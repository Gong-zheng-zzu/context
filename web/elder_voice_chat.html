<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忆安智护 - 老人端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            height: 100vh;
            overflow: hidden;
            font-size: 18px;
            background: #f5f0ff;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* 侧边栏 - 简化版 */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #6a1b9a 0%, #7b1fa2 40%, #8e24aa 100%);
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 20px rgba(106, 27, 154, 0.12);
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-icon svg {
            width: 26px;
            height: 26px;
            fill: white;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            color: white;
            letter-spacing: 2px;
        }

        .sidebar-footer {
            padding: 20px 24px;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: auto;
        }

        .back-btn {
            width: 100%;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        /* 主聊天区域 */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fdfaff;
        }

        .chat-header {
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-bottom: 1px solid #ede7f6;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }

        .chat-title {
            font-size: 22px;
            font-weight: 600;
            color: #6a1b9a;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-title-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #ab47bc, #8e24aa);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-title-icon svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ab47bc, #8e24aa);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
        }

        .logout-btn {
            background: transparent;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 15px;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            border-color: #ef5350;
            color: #ef5350;
            background: #fff5f5;
        }

        /* 消息区域 - 大字体 */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            background: linear-gradient(180deg, #fdfaff 0%, #f5f0ff 100%);
        }

        .message {
            display: flex;
            margin-bottom: 32px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { flex-direction: row-reverse; }

        .message-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #ab47bc, #8e24aa);
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #7b1fa2, #6a1b9a);
        }

        .message-content {
            max-width: 70%;
            margin: 0 18px;
        }

        .message-bubble {
            padding: 20px 24px;
            border-radius: 22px;
            line-height: 1.8;
            font-size: 23px;
        }

        .message.assistant .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #ede7f6;
            box-shadow: 0 2px 8px rgba(171, 71, 188, 0.06);
            border-top-left-radius: 6px;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #7b1fa2, #6a1b9a);
            color: white;
            box-shadow: 0 4px 12px rgba(106, 27, 154, 0.2);
            border-top-right-radius: 6px;
        }

        .message-time {
            font-size: 18px;
            color: #bbb;
            margin-top: 8px;
            padding: 0 6px;
        }

        /* 欢迎界面 - 大字体 */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px;
        }

        .welcome-icon {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #ab47bc, #8e24aa);
            border-radius: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
            box-shadow: 0 14px 36px rgba(171, 71, 188, 0.25);
        }

        .welcome-icon svg {
            width: 54px;
            height: 54px;
            fill: white;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 600;
            color: #6a1b9a;
            margin-bottom: 16px;
        }

        .welcome-desc {
            font-size: 20px;
            color: #888;
            text-align: center;
            margin-bottom: 50px;
            max-width: 640px;
            line-height: 1.8;
        }

        .quick-questions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 680px;
            width: 100%;
        }

        .quick-question {
            background: white;
            border: 2px solid #ede7f6;
            border-radius: 18px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 2px 8px rgba(171, 71, 188, 0.06);
        }

        .quick-question:hover {
            border-color: #ab47bc;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(171, 71, 188, 0.12);
        }

        .quick-question-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #f3e5f5, #e1bee7);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 14px;
        }

        .quick-question-text {
            font-size: 23px;
            color: #333;
            font-weight: 600;
        }

        /* 输入区域 - 大按钮 */
        .input-area {
            padding: 24px 32px 28px;
            background: white;
            border-top: 1px solid #ede7f6;
        }

        .input-container {
            display: flex;
            gap: 14px;
            align-items: flex-end;
            max-width: 960px;
            margin: 0 auto;
        }

        .input-wrapper { flex: 1; position: relative; }

        .message-input {
            width: 100%;
            min-height: 60px;
            max-height: 150px;
            padding: 18px 140px 18px 24px;
            border: 2px solid #ede7f6;
            border-radius: 30px;
            font-size: 23px;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
            background: #fdfaff;
        }

        .message-input:focus {
            border-color: #ab47bc;
            background: white;
            box-shadow: 0 0 0 4px rgba(171, 71, 188, 0.1);
        }

        .message-input::placeholder { color: #ccc; }

        /* 语音按钮 - 大按钮 */
        .voice-btn {
            position: absolute;
            right: 70px;
            bottom: 8px;
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #ab47bc, #8e24aa);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(171, 71, 188, 0.3);
        }

        .voice-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 16px rgba(171, 71, 188, 0.4);
        }

        .voice-btn.recording {
            background: linear-gradient(135deg, #e53935, #ef5350);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        .attach-btn {
            position: absolute;
            right: 14px;
            bottom: 8px;
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #ab47bc, #8e24aa);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(171, 71, 188, 0.3);
        }

        .attach-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 16px rgba(171, 71, 188, 0.4);
        }

        .file-input { display: none; }

        /* 文件上传相关样式 */
        .file-preview-container {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-width: 960px;
            margin-left: auto;
            margin-right: auto;
        }

        .file-preview-item {
            position: relative;
            background: #fdfaff;
            border: 2px solid #ede7f6;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 300px;
        }

        .file-preview-icon { font-size: 28px; flex-shrink: 0; }
        .file-preview-info { flex: 1; min-width: 0; }
        .file-preview-name {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-preview-size { font-size: 12px; color: #999; margin-top: 2px; }

        .file-preview-remove {
            width: 24px;
            height: 24px;
            background: #ef5350;
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .file-preview-remove:hover { background: #e53935; }

        .file-message-attachment {
            margin-top: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 8px 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .message.user .file-message-attachment { background: rgba(255,255,255,0.15); }
        .message.assistant .file-message-attachment {
            background: #f3e5f5;
            border: 1px solid #e1bee7;
        }

        .send-btn {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ab47bc, #8e24aa);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
            box-shadow: 0 6px 16px rgba(171, 71, 188, 0.3);
        }

        .send-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 24px rgba(171, 71, 188, 0.4);
        }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .input-hint {
            font-size: 20px;
            color: #bbb;
            text-align: center;
            margin-top: 14px;
            max-width: 960px;
            margin-left: auto;
            margin-right: auto;
        }

        .voice-status {
            font-size: 18px;
            color: #e53935;
            text-align: center;
            margin-top: 10px;
            font-weight: 600;
        }

        /* 加载动画 */
        .typing-indicator {
            display: flex;
            gap: 8px;
            padding: 20px 24px;
        }

        .typing-dot {
            width: 10px;
            height: 10px;
            background: #ccc;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-12px); }
        }

        /* 响应式设计 */
        @media (max-width: 968px) {
            .sidebar { display: none; }
            .quick-questions { grid-template-columns: 1fr; }
            .message-content { max-width: 85%; }
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d0c8de; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #b0a8be; }

        /* 登录界面 */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .login-container {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
            max-width: 480px;
            width: 90%;
        }

        .login-header { text-align: center; margin-bottom: 36px; }

        .login-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ab47bc, #8e24aa);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 28px rgba(171, 71, 188, 0.3);
        }

        .login-logo svg { width: 40px; height: 40px; fill: white; }

        .login-title {
            font-size: 28px;
            font-weight: 600;
            color: #6a1b9a;
            margin-bottom: 10px;
        }

        .login-subtitle { font-size: 16px; color: #999; }

        .test-users-section {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid #eee;
        }

        .test-users-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .test-users-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .test-user-btn {
            background: #fdfaff;
            border: 2px solid #ede7f6;
            border-radius: 16px;
            padding: 22px 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .test-user-btn:hover {
            border-color: #ab47bc;
            background: #f3e5f5;
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(171, 71, 188, 0.15);
        }

        .test-user-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ab47bc, #8e24aa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 12px rgba(171, 71, 188, 0.25);
        }

        .test-user-name { font-size: 17px; font-weight: 600; color: #6a1b9a; }
        .test-user-id { font-size: 13px; color: #999; }
        .login-hint { text-align: center; font-size: 14px; color: #999; margin-top: 20px; }

        /* Agent模式开关 */
        .agent-toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
        .agent-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
        .agent-toggle input { display: none; }
        .agent-toggle-slider {
            width: 36px; height: 20px; background: #ccc; border-radius: 10px;
            position: relative; transition: background 0.3s;
        }
        .agent-toggle-slider::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 16px; height: 16px; background: #fff; border-radius: 50%;
            transition: transform 0.3s;
        }
        .agent-toggle input:checked + .agent-toggle-slider { background: #4caf50; }
        .agent-toggle input:checked + .agent-toggle-slider::after { transform: translateX(16px); }
        .agent-toggle-label { font-size: 12px; color: #666; font-weight: 500; }
        .agent-toggle input:checked ~ .agent-toggle-label { color: #4caf50; }
        .agent-trace {
            margin: 4px 60px 4px 60px; border: 1px solid #e0e0e0; border-radius: 8px;
            background: #fafbfc; font-size: 12px; overflow: hidden;
        }
        .agent-trace-toggle {
            padding: 8px 12px; cursor: pointer; color: #1565c0; font-weight: 500;
            background: #f0f4f8; border-bottom: 1px solid #e0e0e0;
            transition: background 0.2s;
        }
        .agent-trace-toggle:hover { background: #e3edf7; }
        .agent-trace-content { display: none; padding: 8px 12px; }
        .agent-trace.expanded .agent-trace-content { display: block; }
        .agent-trace.expanded .agent-trace-toggle { border-bottom: 1px solid #e0e0e0; }
        .agent-step {
            margin-bottom: 8px; padding: 6px 8px; border-radius: 6px;
            background: #fff; border-left: 3px solid #1565c0;
        }
        .agent-step-header { font-weight: 600; color: #1565c0; margin-bottom: 4px; font-size: 11px; }
        .agent-action { color: #e65100; margin-bottom: 3px; line-height: 1.5; }
        .agent-execution-status { color: #2e7d32; margin-bottom: 3px; line-height: 1.5; }
        .agent-label { font-weight: 600; }
        .agent-stats { color: #888; font-size: 11px; text-align: right; margin-top: 4px; padding-top: 6px; border-top: 1px solid #eee; }
        .agent-fallback-tag { color: #ff9800; font-weight: 500; }
    </style>
</head>
<body>
    <!-- 登录界面 -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-container">
            <div class="login-header">
                <div class="login-logo">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2a7.2 7.2 0 01-6-3.22c.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08a7.2 7.2 0 01-6 3.22z"/>
                    </svg>
                </div>
                <div class="login-title">老人对话端</div>
                <div class="login-subtitle">选择测试用户快速登录</div>
            </div>

            <div class="test-users-section">
                <div class="test-users-title">测试用户快速登录</div>
                <div class="test-users-grid">
                    <button class="test-user-btn" onclick="quickLogin('张爷爷', 'elder_zhang')">
                        <div class="test-user-avatar">👴</div>
                        <div class="test-user-name">张爷爷</div>
                        <div class="test-user-id">elder_zhang</div>
                    </button>
                    <button class="test-user-btn" onclick="quickLogin('李奶奶', 'elder_li')">
                        <div class="test-user-avatar">👵</div>
                        <div class="test-user-name">李奶奶</div>
                        <div class="test-user-id">elder_li</div>
                    </button>
                    <button class="test-user-btn" onclick="quickLogin('王爷爷', 'elder_wang')">
                        <div class="test-user-avatar">👴</div>
                        <div class="test-user-name">王爷爷</div>
                        <div class="test-user-id">elder_wang</div>
                    </button>
                    <button class="test-user-btn" onclick="quickLogin('赵奶奶', 'elder_zhao')">
                        <div class="test-user-avatar">👵</div>
                        <div class="test-user-name">赵奶奶</div>
                        <div class="test-user-id">elder_zhao</div>
                    </button>
                </div>
                <div class="login-hint">点击任意用户即可快速登录，无需密码</div>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
                            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                    </div>
                    <div class="logo-text">忆安智护</div>
                </div>
            </div>

            <div class="sidebar-footer">
                <a href="role_selection.html" class="back-btn">返回</a>
            </div>
        </div>

        <!-- 主聊天区域 -->
        <div class="chat-main">
            <div class="chat-header">
                <div class="chat-title">
                    <div class="chat-title-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
                            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                    </div>
                    老人健康助手
                </div>
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">老人</div>
                    <button class="logout-btn" onclick="logout()">切换用户</button>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
                            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                    </div>
                    <div class="welcome-title">您好！我是您的健康助手</div>
                    <div class="welcome-desc">
                        您可以点击下面的按钮，或者点击麦克风说话，我会告诉您的健康状况。
                    </div>
                    <div class="quick-questions">
                        <div class="quick-question" onclick="sendQuickQuestion('我今天感觉怎么样')">
                            <div class="quick-question-icon">❤️</div>
                            <div class="quick-question-text">我今天怎么样</div>
                        </div>
                        <div class="quick-question" onclick="sendQuickQuestion('我的血压正常吗')">
                            <div class="quick-question-icon">📊</div>
                            <div class="quick-question-text">我的血压</div>
                        </div>
                        <div class="quick-question" onclick="sendQuickQuestion('今天吃什么药')">
                            <div class="quick-question-icon">💊</div>
                            <div class="quick-question-text">今天吃什么药</div>
                        </div>
                        <div class="quick-question" onclick="sendQuickQuestion('我需要注意什么')">
                            <div class="quick-question-icon">💡</div>
                            <div class="quick-question-text">注意事项</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <div class="input-wrapper">
                        <textarea class="message-input" id="messageInput" placeholder="点击麦克风说话，或者在这里输入..." rows="1" onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
                        <button class="attach-btn" onclick="attachFile()">📎</button>
                        <input type="file" id="fileInput" class="file-input" accept=".jpg,.jpeg,.png,.gif,.bmp,.pdf,.doc,.docx,.txt" onchange="handleFileSelect(event)" multiple>
                        <button class="voice-btn" id="voiceBtn" onclick="toggleVoiceRecording()">🎤</button>
                    </div>
                    <div class="agent-toggle-row">
                        <label class="agent-toggle" title="按身份与会话边界调用已登记工具">
                            <input type="checkbox" id="agentToggle" onchange="toggleAgentMode(this.checked)">
                            <span class="agent-toggle-slider"></span>
                            <span class="agent-toggle-label">受控 Agent 执行</span>
                        </label>
                        <span class="agent-toggle-label" id="agentModeStatus">当前：普通对话</span>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
                    </div>
                </div>
                <div id="filePreviewContainer" class="file-preview-container"></div>
                <div class="input-hint">任务示例：<button type="button" onclick="sendQuickQuestion('查询近期风险事件')">查询近期风险事件</button> <button type="button" onclick="sendQuickQuestion('整理今日护理记录')">整理护理记录</button> <button type="button" onclick="sendQuickQuestion('生成交接摘要')">生成交接摘要</button></div>
                <div class="voice-status" id="voiceStatus"></div>
                <div class="input-hint">💡 提示：点击麦克风按钮说话，我会自动识别并回答您</div>
                <div class="input-hint" style="margin-top: 5px; font-size: 14px; color: #aaa;">支持上传：图片(JPG/PNG/GIF)、PDF、文本文件(TXT)、Word文档(DOC/DOCX)</div>
            </div>
        </div>
    </div>

    <!-- 配置文件 -->
    <script src="js/config.js"></script>
    <!-- 通用聊天功能 -->
    <script src="js/chat-common.js?v=privacy-redaction-2"></script>
    <script src="js/auth-security-override.js"></script>
    <script>
        // 老人端特定配置
        const ROLE_CONFIG = {
            role: 'elder',
            roleName: '老人',
            systemPrompt: `你是老人健康助手。你的职责是：
1. 用简单、温暖的语言与老人交流
2. 告诉老人他们的健康状况
3. 提供生活建议和鼓励
4. 回答老人的日常问题

使用：
- 简短的句子
- 通俗的词汇
- 温暖的语气
- 适合语音播报的表达

避免使用医学术语，用老人能理解的方式说话。`,
            quickQuestions: [
                { icon: '❤️', text: '我今天怎么样', question: '我今天感觉怎么样' },
                { icon: '📊', text: '我的血压', question: '我的血压正常吗' },
                { icon: '💊', text: '今天吃什么药', question: '今天吃什么药' },
                { icon: '💡', text: '注意事项', question: '我需要注意什么' }
            ],
            enableVoice: true,
            autoSpeak: true
        };

        // 附件功能
        function attachFile() { document.getElementById('fileInput').click(); }
        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            for (const file of files) {
                if (file.size > 10 * 1024 * 1024) { alert(`文件 ${file.name} 大小超过10MB限制`); continue; }
                const allowedTypes = ['.jpg', '.jpeg', '.png', '.gif', '.bmp', '.pdf', '.doc', '.docx', '.txt'];
                const fileExt = '.' + file.name.split('.').pop().toLowerCase();
                if (!allowedTypes.includes(fileExt)) { alert(`文件 ${file.name} 类型不支持`); continue; }
                selectedFiles.push(file);
            }
            updateFilePreview();
            event.target.value = '';
        }
        function updateFilePreview() {
            const container = document.getElementById('filePreviewContainer');
            container.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-preview-item';
                fileItem.innerHTML = `<div class="file-preview-icon">${getFileIcon(file.name)}</div><div class="file-preview-info"><div class="file-preview-name">${file.name}</div><div class="file-preview-size">${formatFileSize(file.size)}</div></div><button class="file-preview-remove" onclick="removeFile(${index})">×</button>`;
                container.appendChild(fileItem);
            });
        }
        function removeFile(index) { selectedFiles.splice(index, 1); updateFilePreview(); }
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const iconMap = { 'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️', 'bmp': '🖼️', 'pdf': '📄', 'doc': '📝', 'docx': '📝', 'txt': '📃' };
            return iconMap[ext] || '📎';
        }
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        // 语音识别相关
        let recognition = null;
        let isRecording = false;
        let synthesis = window.speechSynthesis;

        function initVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                console.warn('浏览器不支持语音识别');
                document.getElementById('voiceBtn').style.display = 'none';
                return;
            }
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.onstart = function() {
                isRecording = true;
                document.getElementById('voiceBtn').classList.add('recording');
                document.getElementById('voiceBtn').textContent = '🔴';
                document.getElementById('voiceStatus').textContent = '正在听您说话...';
            };
            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('messageInput').value = transcript;
                document.getElementById('voiceStatus').textContent = '';
                setTimeout(() => { sendMessage(); }, 500);
            };
            recognition.onerror = function(event) {
                console.error('语音识别错误:', event.error);
                document.getElementById('voiceStatus').textContent = '识别失败，请重试';
                stopVoiceRecording();
            };
            recognition.onend = function() { stopVoiceRecording(); };
        }

        function toggleVoiceRecording() {
            if (!recognition) { alert('您的浏览器不支持语音识别功能'); return; }
            if (isRecording) { stopVoiceRecording(); }
            else { startVoiceRecording(); }
        }

        function startVoiceRecording() {
            try { recognition.start(); }
            catch (error) { console.error('启动语音识别失败:', error); }
        }

        function stopVoiceRecording() {
            if (recognition && isRecording) { recognition.stop(); }
            isRecording = false;
            document.getElementById('voiceBtn').classList.remove('recording');
            document.getElementById('voiceBtn').textContent = '🎤';
            document.getElementById('voiceStatus').textContent = '';
        }

        function speakText(text) {
            if (!ROLE_CONFIG.autoSpeak) return;
            synthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            synthesis.speak(utterance);
        }

        const originalSendMessage = window.sendMessage;
        window.sendMessage = async function() {
            if (isRecording) { stopVoiceRecording(); }
            await originalSendMessage();
        };

        const originalAddMessage = window.addMessage;
        window.addMessage = function(type, content, timestamp, files) {
            originalAddMessage(type, content, timestamp, files);
            if (type === 'assistant' && ROLE_CONFIG.autoSpeak) { speakText(content); }
        };

        // 初始化
        initializeChat(ROLE_CONFIG);
        if (ROLE_CONFIG.enableVoice) { initVoiceRecognition(); }
    </script>
</body>
</html>

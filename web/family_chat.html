<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忆安智护 - 家属端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #fffaf5;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* 侧边栏 */
        .sidebar {
            width: 300px;
            background: linear-gradient(180deg, #e65100 0%, #f57c00 40%, #fb8c00 100%);
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 20px rgba(230, 81, 0, 0.12);
            position: relative;
        }

        .sidebar::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 1px;
            height: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 100%);
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-icon svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            color: white;
            letter-spacing: 2px;
        }

        .new-chat-btn {
            width: 100%;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 14px;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .new-chat-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .history-item {
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            color: rgba(255,255,255,0.75);
        }

        .history-item:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .history-item.active {
            background: rgba(255,255,255,0.18);
            color: white;
            font-weight: 500;
        }

        .sidebar-footer {
            padding: 20px 24px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .back-btn {
            width: 100%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        /* 主聊天区域 */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fffdf9;
        }

        .chat-header {
            padding: 18px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-bottom: 1px solid #f0e6d8;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
        }

        .chat-title {
            font-size: 18px;
            font-weight: 600;
            color: #e65100;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-title-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #fb8c00, #f57c00);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-title-icon svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #fb8c00, #f57c00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 13px;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            border-color: #ef5350;
            color: #ef5350;
            background: #fff5f5;
        }

        /* 消息区域 */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            background: linear-gradient(180deg, #fffdf9 0%, #fff8f0 100%);
        }

        .message {
            display: flex;
            margin-bottom: 28px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { flex-direction: row-reverse; }

        .message-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #fb8c00, #f57c00);
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #e65100, #f57c00);
        }

        .message-content {
            max-width: 70%;
            margin: 0 16px;
        }

        .message-bubble {
            padding: 16px 20px;
            border-radius: 18px;
            line-height: 1.7;
            font-size: 20px;
        }

        .message.assistant .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #f0e6d8;
            box-shadow: 0 2px 8px rgba(255, 167, 38, 0.06);
            border-top-left-radius: 4px;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #e65100, #f57c00);
            color: white;
            box-shadow: 0 4px 12px rgba(230, 81, 0, 0.18);
            border-top-right-radius: 4px;
        }

        .message-time {
            font-size: 16px;
            color: #bbb;
            margin-top: 6px;
            padding: 0 4px;
        }

        /* 欢迎界面 */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px;
        }

        .welcome-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #fb8c00, #f57c00);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
            box-shadow: 0 12px 32px rgba(255, 167, 38, 0.25);
        }

        .welcome-icon svg {
            width: 50px;
            height: 50px;
            fill: white;
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 600;
            color: #e65100;
            margin-bottom: 12px;
        }

        .welcome-desc {
            font-size: 16px;
            color: #888;
            text-align: center;
            margin-bottom: 48px;
            max-width: 560px;
            line-height: 1.8;
        }

        .quick-questions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            max-width: 600px;
            width: 100%;
        }

        .quick-question {
            background: white;
            border: 1px solid #f0e6d8;
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            box-shadow: 0 2px 8px rgba(255, 167, 38, 0.06);
        }

        .quick-question:hover {
            border-color: #fb8c00;
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(255, 167, 38, 0.12);
        }

        .quick-question-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .quick-question-text {
            font-size: 19px;
            color: #333;
            font-weight: 500;
        }

        /* 输入区域 */
        .input-area {
            padding: 20px 32px 24px;
            background: white;
            border-top: 1px solid #f0e6d8;
        }

        .input-container {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            max-width: 960px;
            margin: 0 auto;
        }

        .input-wrapper { flex: 1; position: relative; }

        .message-input {
            width: 100%;
            min-height: 52px;
            max-height: 150px;
            padding: 14px 50px 14px 18px;
            border: 2px solid #f0e6d8;
            border-radius: 26px;
            font-size: 20px;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
            background: #fffaf5;
        }

        .message-input:focus {
            border-color: #fb8c00;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 167, 38, 0.1);
        }

        .message-input::placeholder { color: #ccc; }

        .attach-btn {
            position: absolute;
            right: 12px;
            bottom: 10px;
            width: 34px;
            height: 34px;
            background: transparent;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: background 0.2s ease;
        }

        .attach-btn:hover { background: #f0e6d8; }

        .file-input { display: none; }

        /* 文件上传相关样式 */
        .file-preview-container {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-width: 960px;
            margin-left: auto;
            margin-right: auto;
        }

        .file-preview-item {
            position: relative;
            background: #fffaf5;
            border: 1px solid #f0e6d8;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 280px;
        }

        .file-preview-icon { font-size: 28px; flex-shrink: 0; }
        .file-preview-info { flex: 1; min-width: 0; }
        .file-preview-name {
            font-size: 13px;
            font-weight: 500;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-preview-size { font-size: 11px; color: #999; margin-top: 2px; }

        .file-preview-remove {
            width: 24px;
            height: 24px;
            background: #ef5350;
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            transition: background 0.2s ease;
        }
        .file-preview-remove:hover { background: #e53935; }

        .file-message-attachment {
            margin-top: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 8px 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .message.user .file-message-attachment { background: rgba(255,255,255,0.15); }
        .message.assistant .file-message-attachment {
            background: #fff3e0;
            border: 1px solid #ffe0b2;
        }

        .send-btn {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #fb8c00, #f57c00);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(255, 167, 38, 0.25);
        }

        .send-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 24px rgba(255, 167, 38, 0.35);
        }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .input-hint {
            font-size: 16px;
            color: #bbb;
            text-align: center;
            margin-top: 12px;
            max-width: 960px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 加载动画 */
        .typing-indicator { display: flex; gap: 6px; padding: 16px 20px; }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #ccc;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        /* 响应式设计 */
        @media (max-width: 968px) {
            .sidebar { display: none; }
            .quick-questions { grid-template-columns: 1fr; }
            .message-content { max-width: 85%; }
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e0d5c8; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #c0b5a8; }

        /* 登录界面 */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .login-container {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
            max-width: 440px;
            width: 90%;
        }

        .login-header { text-align: center; margin-bottom: 36px; }

        .login-logo {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #fb8c00, #f57c00);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 8px 24px rgba(255, 167, 38, 0.3);
        }

        .login-logo svg { width: 36px; height: 36px; fill: white; }

        .login-title {
            font-size: 24px;
            font-weight: 600;
            color: #e65100;
            margin-bottom: 8px;
        }

        .login-subtitle { font-size: 14px; color: #999; }

        .test-users-section {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid #eee;
        }

        .test-users-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 18px;
            text-align: center;
        }

        .test-users-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .test-user-btn {
            background: #fffaf5;
            border: 1px solid #f0e6d8;
            border-radius: 14px;
            padding: 18px 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .test-user-btn:hover {
            border-color: #fb8c00;
            background: #fff3e0;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 167, 38, 0.15);
        }

        .test-user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fb8c00, #f57c00);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 12px rgba(255, 167, 38, 0.2);
        }

        .test-user-name { font-size: 14px; font-weight: 600; color: #e65100; }
        .test-user-id { font-size: 11px; color: #999; }
        .login-hint { text-align: center; font-size: 12px; color: #999; margin-top: 20px; }

        /* Agent模式开关 */
        .agent-toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
        .agent-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
        .agent-toggle input { display: none; }
        .agent-toggle-slider {
            width: 36px; height: 20px; background: #ccc; border-radius: 10px;
            position: relative; transition: background 0.3s;
        }
        .agent-toggle-slider::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 16px; height: 16px; background: #fff; border-radius: 50%;
            transition: transform 0.3s;
        }
        .agent-toggle input:checked + .agent-toggle-slider { background: #4caf50; }
        .agent-toggle input:checked + .agent-toggle-slider::after { transform: translateX(16px); }
        .agent-toggle-label { font-size: 12px; color: #666; font-weight: 500; }
        .agent-toggle input:checked ~ .agent-toggle-label { color: #4caf50; }
        .agent-trace {
            margin: 4px 60px 4px 60px; border: 1px solid #e0e0e0; border-radius: 8px;
            background: #fafbfc; font-size: 12px; overflow: hidden;
        }
        .agent-trace-toggle {
            padding: 8px 12px; cursor: pointer; color: #1565c0; font-weight: 500;
            background: #f0f4f8; border-bottom: 1px solid #e0e0e0;
            transition: background 0.2s;
        }
        .agent-trace-toggle:hover { background: #e3edf7; }
        .agent-trace-content { display: none; padding: 8px 12px; }
        .agent-trace.expanded .agent-trace-content { display: block; }
        .agent-trace.expanded .agent-trace-toggle { border-bottom: 1px solid #e0e0e0; }
        .agent-step {
            margin-bottom: 8px; padding: 6px 8px; border-radius: 6px;
            background: #fff; border-left: 3px solid #1565c0;
        }
        .agent-step-header { font-weight: 600; color: #1565c0; margin-bottom: 4px; font-size: 11px; }
        .agent-action { color: #e65100; margin-bottom: 3px; line-height: 1.5; }
        .agent-execution-status { color: #2e7d32; margin-bottom: 3px; line-height: 1.5; }
        .agent-label { font-weight: 600; }
        .agent-stats { color: #888; font-size: 11px; text-align: right; margin-top: 4px; padding-top: 6px; border-top: 1px solid #eee; }
        .agent-fallback-tag { color: #ff9800; font-weight: 500; }
    </style>
</head>
<body>
    <!-- 登录界面 -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-container">
            <div class="login-header">
                <div class="login-logo">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                    </svg>
                </div>
                <div class="login-title">家属对话端</div>
                <div class="login-subtitle">选择测试用户快速登录</div>
            </div>

            <div class="test-users-section">
                <div class="test-users-title">测试用户快速登录</div>
                <div class="test-users-grid">
                    <button class="test-user-btn" onclick="quickLogin('张先生', 'family_zhang')">
                        <div class="test-user-avatar">👨</div>
                        <div class="test-user-name">张先生</div>
                        <div class="test-user-id">family_zhang</div>
                    </button>
                    <button class="test-user-btn" onclick="quickLogin('李女士', 'family_li')">
                        <div class="test-user-avatar">👩</div>
                        <div class="test-user-name">李女士</div>
                        <div class="test-user-id">family_li</div>
                    </button>
                    <button class="test-user-btn" onclick="quickLogin('王先生', 'family_wang')">
                        <div class="test-user-avatar">👨</div>
                        <div class="test-user-name">王先生</div>
                        <div class="test-user-id">family_wang</div>
                    </button>
                    <button class="test-user-btn" onclick="quickLogin('赵女士', 'family_zhao')">
                        <div class="test-user-avatar">👩</div>
                        <div class="test-user-name">赵女士</div>
                        <div class="test-user-id">family_zhao</div>
                    </button>
                </div>
                <div class="login-hint">点击任意用户即可快速登录，无需密码</div>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>

    <script src="js/auth-security-override.js"></script>
    <script>
        function attachFile() { document.getElementById('fileInput').click(); }
        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            for (const file of files) {
                if (file.size > 10 * 1024 * 1024) { alert(`文件 ${file.name} 大小超过10MB限制`); continue; }
                const allowedTypes = ['.jpg', '.jpeg', '.png', '.gif', '.bmp', '.pdf', '.doc', '.docx', '.txt'];
                const fileExt = '.' + file.name.split('.').pop().toLowerCase();
                if (!allowedTypes.includes(fileExt)) { alert(`文件 ${file.name} 类型不支持`); continue; }
                selectedFiles.push(file);
            }
            updateFilePreview();
            event.target.value = '';
        }
        function updateFilePreview() {
            const container = document.getElementById('filePreviewContainer');
            container.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-preview-item';
                fileItem.innerHTML = `<div class="file-preview-icon">${getFileIcon(file.name)}</div><div class="file-preview-info"><div class="file-preview-name">${file.name}</div><div class="file-preview-size">${formatFileSize(file.size)}</div></div><button class="file-preview-remove" onclick="removeFile(${index})">×</button>`;
                container.appendChild(fileItem);
            });
        }
        function removeFile(index) { selectedFiles.splice(index, 1); updateFilePreview(); }
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const iconMap = { 'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️', 'bmp': '🖼️', 'pdf': '📄', 'doc': '📝', 'docx': '📝', 'txt': '📃' };
            return iconMap[ext] || '📎';
        }
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        const ROLE_CONFIG = {
            role: 'family',
            roleName: '家属',
            systemPrompt: `你是养老院家属助手。你的职责是：
1. 向家属报告老人的健康状况
2. 解答家属的关心和疑问
3. 提供探视建议和注意事项
4. 用通俗易懂的语言解释医疗信息

使用温暖、关怀的语气，让家属放心。避免使用过于专业的医学术语，用家属能理解的方式解释。`,
            quickQuestions: [
                { icon: '❤️', text: '询问健康状况', question: '我爸爸今天怎么样？' },
                { icon: '📊', text: '查询健康指标', question: '我妈妈最近血压正常吗？' },
                { icon: '🍚', text: '询问饮食情况', question: '老人今天吃饭怎么样？' },
                { icon: '💡', text: '护理建议', question: '有什么需要注意的吗？' }
            ]
        };

        initializeChat(ROLE_CONFIG);
    </script>

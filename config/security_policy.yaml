# ============================================
# Context-Keeper 安全策略配置文件
# ============================================
# 包含敏感信息检测、脱敏、JWT、限流、加密等安全配置
# ============================================

# ============================================
# 一、敏感信息检测 (Sensitive Detection)
# ============================================
sensitive_detection:
  enabled: true
  description: "检测和识别各类敏感信息"

  # 检测规则配置
  rules:
    # 规则1: 高危凭证检测
    - id: "rule-001"
      name: "高危凭证检测"
      description: "检测 API 密钥、密码、私钥等高危凭证"
      enabled: true
      priority: "critical"

      # 敏感类型列表
      sensitive_types:
        - type: "api_key"
          patterns:
            - regex: 'api[_-]?key[\s]*[=:]\s*["\']?([a-zA-Z0-9_\-]{20,})["\']?'
              description: "通用 API Key 格式"
            - regex: 'sk-[a-zA-Z0-9]{20,50}'
              description: "OpenAI API Key"
            - regex: 'AKIA[0-9A-Z]{16}'
              description: "AWS Access Key"
          confidence_threshold: 0.9

        - type: "password"
          patterns:
            - regex: 'password[\s]*[=:]\s*["\']?([^\s"\']{6,})["\']?'
              description: "密码字段"
            - regex: 'passwd[\s]*[=:]\s*["\']?([^\s"\']{6,})["\']?'
              description: "passwd 字段"
          confidence_threshold: 0.8

        - type: "private_key"
          patterns:
            - regex: '-----BEGIN (RSA |EC |DSA )?PRIVATE KEY-----'
              description: "PEM 格式私钥"
            - regex: '-----BEGIN OPENSSH PRIVATE KEY-----'
              description: "OpenSSH 私钥"
          confidence_threshold: 1.0

        - type: "secret_key"
          patterns:
            - regex: 'secret[_-]?key[\s]*[=:]\s*["\']?([a-zA-Z0-9_\-]{20,})["\']?'
              description: "Secret Key"
          confidence_threshold: 0.85

      # 检测后的行动
      actions:
        - "log"           # 记录日志
        - "redact"        # 脱敏处理
        - "alert"         # 发送告警
        - "block"         # 阻止（可选）

      # 告警阈值
      alert_config:
        threshold_count: 1         # 检测到1次就告警
        threshold_window_seconds: 60
        alert_channels: ["email", "slack", "syslog"]

    # 规则2: 认证令牌检测
    - id: "rule-002"
      name: "认证令牌检测"
      description: "检测各类认证令牌和 Token"
      enabled: true
      priority: "high"

      sensitive_types:
        - type: "bearer_token"
          patterns:
            - regex: 'Bearer\s+[a-zA-Z0-9\-._~+/]+=*'
              description: "Bearer Token"
          confidence_threshold: 0.9

        - type: "jwt_token"
          patterns:
            - regex: 'eyJ[a-zA-Z0-9_-]*\.eyJ[a-zA-Z0-9_-]*\.[a-zA-Z0-9_-]*'
              description: "JWT Token"
          confidence_threshold: 0.95

        - type: "oauth_token"
          patterns:
            - regex: 'access[_-]?token[\s]*[=:]\s*["\']?([a-zA-Z0-9_\-\.]{20,})["\']?'
              description: "OAuth Access Token"
          confidence_threshold: 0.85

      actions: ["log", "redact"]
      alert_config:
        threshold_count: 3
        threshold_window_seconds: 300

    # 规则3: 个人隐私信息检测
    - id: "rule-003"
      name: "个人隐私信息检测"
      description: "检测信用卡、身份证、手机号等个人敏感信息"
      enabled: true
      priority: "high"

      sensitive_types:
        - type: "credit_card"
          patterns:
            - regex: '\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13}|6(?:011|5[0-9]{2})[0-9]{12})\b'
              description: "信用卡号（Visa/MasterCard/Amex/Discover）"
          confidence_threshold: 0.95
          validation:
            - "luhn_check"  # Luhn 算法验证

        - type: "ssn"
          patterns:
            - regex: '\b\d{3}-\d{2}-\d{4}\b'
              description: "美国社保号"
          confidence_threshold: 0.9

        - type: "id_card_cn"
          patterns:
            - regex: '\b[1-9]\d{5}(18|19|20)\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])\d{3}[\dXx]\b'
              description: "中国身份证号"
          confidence_threshold: 0.95
          validation:
            - "id_card_checksum"

        - type: "phone"
          patterns:
            - regex: '\b1[3-9]\d{9}\b'
              description: "中国手机号"
            - regex: '\b\+?1?\s*\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}\b'
              description: "美国/国际手机号"
          confidence_threshold: 0.85

        - type: "email"
          patterns:
            - regex: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b'
              description: "邮箱地址"
          confidence_threshold: 0.9

      actions: ["log", "redact"]
      alert_config:
        threshold_count: 5
        threshold_window_seconds: 600

    # 规则4: 数据库凭证检测
    - id: "rule-004"
      name: "数据库凭证检测"
      description: "检测数据库连接字符串和凭证"
      enabled: true
      priority: "critical"

      sensitive_types:
        - type: "database_url"
          patterns:
            - regex: '(mongodb|mysql|postgresql|redis)://[^\s]+'
              description: "数据库连接字符串"
            - regex: 'jdbc:[^\s]+'
              description: "JDBC 连接字符串"
          confidence_threshold: 0.95

        - type: "connection_string"
          patterns:
            - regex: 'Server=.*;Database=.*;User Id=.*;Password=.*;'
              description: "SQL Server 连接字符串"
          confidence_threshold: 0.95

      actions: ["log", "redact", "alert", "block"]
      alert_config:
        threshold_count: 1
        threshold_window_seconds: 60

  # AI 辅助检测（可选）
  ai_detection:
    enabled: true
    description: "使用 LLM 辅助检测复杂的敏感信息"

    model_config:
      provider: "ollama_local"  # 优先使用本地模型保护隐私
      model: "deepseek-coder-v2:16b"
      fallback_provider: "deepseek"

    detection_scenarios:
      - "未知格式的敏感数据"
      - "上下文相关的敏感信息"
      - "变形的敏感数据（Base64编码等）"

    confidence_threshold: 0.8
    max_context_length: 2000  # 传递给 LLM 的最大上下文长度

  # 性能优化
  performance:
    enable_parallel_detection: true  # 并行检测多个规则
    max_concurrent_rules: 5
    detection_timeout_ms: 1000       # 单次检测超时
    enable_caching: true             # 缓存检测结果
    cache_ttl_minutes: 10

# ============================================
# 二、脱敏级别配置 (Redaction Levels)
# ============================================
redaction_levels:
  description: "不同级别的脱敏策略"

  # 级别1: 完全脱敏
  full_redaction:
    name: "完全脱敏"
    description: "完全隐藏敏感信息，不保留任何原始数据"
    applicable_types:
      - "api_key"
      - "password"
      - "private_key"
      - "secret_key"
      - "database_url"

    strategies:
      - method: "replace_with_placeholder"
        placeholder: "***REDACTED***"
        example:
          original: "api_key=sk-abc123def456"
          redacted: "api_key=***REDACTED***"

      - method: "remove_completely"
        description: "完全删除敏感字段"
        example:
          original: '{"password": "secret123"}'
          redacted: '{}'

  # 级别2: 部分脱敏
  partial_redaction:
    name: "部分脱敏"
    description: "保留部分信息用于识别，隐藏关键部分"
    applicable_types:
      - "credit_card"
      - "phone"
      - "email"
      - "id_card_cn"
      - "bearer_token"

    strategies:
      - method: "mask_middle"
        description: "保留前后各N位，中间用*替换"
        keep_prefix: 4
        keep_suffix: 4
        mask_char: "*"
        example:
          original: "4532123456789012"
          redacted: "4532********9012"

      - method: "mask_domain"
        description: "邮箱保留域名，隐藏用户名部分"
        applicable_to: ["email"]
        example:
          original: "user@example.com"
          redacted: "u***@example.com"

      - method: "hash_sensitive_part"
        description: "对敏感部分进行哈希"
        hash_algorithm: "sha256"
        truncate_hash: 8
        example:
          original: "Bearer abc123def456"
          redacted: "Bearer a1b2c3d4"

  # 级别3: 最小脱敏
  minimal_redaction:
    name: "最小脱敏"
    description: "仅标记敏感信息，不做修改（用于内部审计）"
    applicable_types: ["all"]

    strategies:
      - method: "add_metadata_tag"
        description: "添加敏感信息标签但保留原文"
        tag_format: "[SENSITIVE:{type}]{content}[/SENSITIVE]"
        example:
          original: "api_key=sk-abc123"
          redacted: "[SENSITIVE:api_key]api_key=sk-abc123[/SENSITIVE]"

      - method: "log_only"
        description: "仅记录日志，不修改数据"

  # 级别4: 不脱敏
  no_redaction:
    name: "不脱敏"
    description: "保留原始数据，仅用于调试环境"
    applicable_types: ["all"]

    conditions:
      - environment: "development"
      - explicit_user_consent: true

  # 默认策略映射
  default_level_mapping:
    critical: "full_redaction"      # 高危凭证使用完全脱敏
    high: "partial_redaction"        # 个人信息使用部分脱敏
    medium: "partial_redaction"      # 中等风险使用部分脱敏
    low: "minimal_redaction"         # 低风险使用最小脱敏

# ============================================
# 三、JWT 配置 (JWT Settings)
# ============================================
jwt_settings:
  description: "JSON Web Token 认证配置"

  # 密钥管理
  secret_key:
    source: "env"  # env / file / vault / hsm
    env_var: "JWT_SECRET_KEY"
    rotation_enabled: true
    rotation_interval_days: 90

    # 密钥强度要求
    key_requirements:
      min_length: 32
      allowed_algorithms: ["HS256", "HS512", "RS256", "ES256"]
      default_algorithm: "HS256"

  # Token 生命周期
  token_lifetime:
    # Access Token（访问令牌）
    access_token:
      expiration_minutes: 15        # 15分钟过期
      renewable: false              # 不可续期，需刷新

    # Refresh Token（刷新令牌）
    refresh_token:
      expiration_days: 30           # 30天过期
      renewable: true               # 可续期
      max_renewal_count: 5          # 最多续期5次

    # Remember Me Token（记住我令牌）
    remember_me_token:
      expiration_days: 90           # 90天过期
      renewable: true
      require_password_reauth_days: 30  # 30天后需重新输入密码

  # Token 刷新策略
  refresh_strategy:
    enabled: true
    description: "自动刷新 Token 策略"

    # 滑动窗口刷新
    sliding_window:
      enabled: true
      refresh_threshold_minutes: 5   # Access Token 过期前5分钟自动刷新

    # 刷新限制
    rate_limiting:
      enabled: true
      max_refreshes_per_hour: 10
      max_refreshes_per_day: 50

    # 刷新 Token 轮换
    refresh_token_rotation:
      enabled: true
      description: "每次刷新后生成新的 Refresh Token，旧的失效"
      grace_period_seconds: 60      # 旧 Token 的宽限期（防止并发刷新）

  # Token 负载 (Claims)
  claims:
    required_claims:
      - "sub"   # Subject（用户ID）
      - "exp"   # Expiration Time
      - "iat"   # Issued At
      - "jti"   # JWT ID（唯一标识）

    custom_claims:
      - name: "user_id"
        type: "string"
        required: true
      - name: "username"
        type: "string"
        required: true
      - name: "roles"
        type: "array"
        required: false
      - name: "permissions"
        type: "array"
        required: false
      - name: "tenant_id"
        type: "string"
        required: false

    # 敏感字段（不放入 Token）
    excluded_fields:
      - "password"
      - "password_hash"
      - "secret_key"
      - "api_key"

  # Token 验证
  validation:
    verify_signature: true
    verify_expiration: true
    verify_not_before: true
    verify_issuer: true
    verify_audience: true

    # 允许的时钟偏移
    clock_skew_seconds: 60

    # Token 黑名单
    blacklist:
      enabled: true
      storage: "redis"
      redis_key_prefix: "jwt:blacklist:"
      check_on_every_request: true

  # 安全增强
  security:
    # 防止重放攻击
    anti_replay:
      enabled: true
      use_jti: true                 # 使用 JWT ID 追踪
      store_used_tokens: true
      storage_ttl_hours: 24

    # IP 绑定
    ip_binding:
      enabled: false                # 生产环境可能不适用（CDN/代理）
      allow_ip_change: false

    # User-Agent 绑定
    user_agent_binding:
      enabled: true
      allow_change: false           # 不允许更换浏览器

    # 设备指纹
    device_fingerprint:
      enabled: true
      fingerprint_algorithm: "sha256"
      include_components:
        - "user_agent"
        - "accept_language"
        - "screen_resolution"

# ============================================
# 四、限流策略 (Rate Limiting)
# ============================================
rate_limiting:
  description: "不同接口和用户的限流配置"
  enabled: true

  # 限流算法
  algorithm: "token_bucket"  # token_bucket / sliding_window / fixed_window / leaky_bucket

  # 全局限流
  global:
    enabled: true
    requests_per_second: 1000
    burst_size: 1500              # 允许的突发请求数

  # 按接口限流
  per_endpoint:
    # 查询接口
    - endpoint: "/api/v1/query"
      methods: ["POST"]
      limits:
        anonymous:
          requests_per_minute: 10
          requests_per_hour: 100
        authenticated:
          requests_per_minute: 60
          requests_per_hour: 1000
        premium:
          requests_per_minute: 300
          requests_per_hour: 10000
      burst_multiplier: 1.5

    # 召回接口（两阶段第一阶段）
    - endpoint: "/api/v1/recall"
      methods: ["POST"]
      limits:
        authenticated:
          requests_per_minute: 30
          requests_per_hour: 500
        premium:
          requests_per_minute: 120
          requests_per_hour: 3000
      concurrent_limit: 10          # 同时并发限制

    # 排序接口（两阶段第二阶段）
    - endpoint: "/api/v1/rank"
      methods: ["POST"]
      limits:
        authenticated:
          requests_per_minute: 20
          requests_per_hour: 300
        premium:
          requests_per_minute: 100
          requests_per_hour: 2000
      concurrent_limit: 5

    # 上传接口
    - endpoint: "/api/v1/upload"
      methods: ["POST"]
      limits:
        authenticated:
          requests_per_minute: 5
          requests_per_hour: 50
          max_file_size_mb: 10
        premium:
          requests_per_minute: 20
          requests_per_hour: 200
          max_file_size_mb: 50

    # 认证接口
    - endpoint: "/api/v1/auth/login"
      methods: ["POST"]
      limits:
        anonymous:
          requests_per_minute: 5     # 防暴力破解
          requests_per_hour: 20
      lockout:
        enabled: true
        failed_attempts_threshold: 5
        lockout_duration_minutes: 30

    # 注册接口
    - endpoint: "/api/v1/auth/register"
      methods: ["POST"]
      limits:
        anonymous:
          requests_per_minute: 2
          requests_per_hour: 10
      additional_checks:
        - "email_verification"
        - "captcha_required"

  # 按用户限流
  per_user:
    free_tier:
      requests_per_minute: 10
      requests_per_hour: 100
      requests_per_day: 1000
      concurrent_requests: 2

    basic_tier:
      requests_per_minute: 60
      requests_per_hour: 1000
      requests_per_day: 10000
      concurrent_requests: 5

    premium_tier:
      requests_per_minute: 300
      requests_per_hour: 10000
      requests_per_day: 100000
      concurrent_requests: 20

    enterprise_tier:
      requests_per_minute: 1000
      requests_per_hour: 50000
      requests_per_day: 500000
      concurrent_requests: 100

  # 按 IP 限流
  per_ip:
    enabled: true
    requests_per_minute: 100
    requests_per_hour: 1000
    whitelist:
      - "127.0.0.1"
      - "::1"
    blacklist: []

  # 按 API Key 限流
  per_api_key:
    enabled: true
    default_limits:
      requests_per_minute: 60
      requests_per_day: 10000

  # 超限处理
  on_limit_exceeded:
    response_code: 429
    response_message: "请求过于频繁，请稍后再试"
    include_retry_after_header: true

    # 渐进式惩罚
    progressive_penalty:
      enabled: true
      penalty_multiplier: 2          # 每次超限，限制时间翻倍
      max_penalty_minutes: 60
      reset_after_minutes: 120

  # 限流存储
  storage:
    backend: "redis"
    redis_url: "redis://localhost:6379/1"
    key_prefix: "rate_limit:"
    key_ttl_seconds: 3600

# ============================================
# 五、加密配置 (Encryption)
# ============================================
encryption:
  description: "数据加密和密钥管理配置"

  # 数据加密
  data_encryption:
    # 静态数据加密（数据库）
    at_rest:
      enabled: true
      algorithm: "AES-256-GCM"      # AES-256 GCM 模式
      key_size_bits: 256

      # 加密范围
      encrypted_fields:
        - "user.password_hash"      # 虽然已哈希，但再加密
        - "user.api_keys"
        - "context.sensitive_content"
        - "logs.sensitive_data"

      # 密钥派生
      key_derivation:
        algorithm: "PBKDF2"
        iterations: 100000
        salt_length_bytes: 32

    # 传输中加密
    in_transit:
      enabled: true
      enforce_https: true
      tls_version: "1.3"            # 最低 TLS 1.3
      cipher_suites:
        - "TLS_AES_256_GCM_SHA384"
        - "TLS_CHACHA20_POLY1305_SHA256"
        - "TLS_AES_128_GCM_SHA256"

      # HSTS 配置
      hsts:
        enabled: true
        max_age_seconds: 31536000   # 1年
        include_subdomains: true
        preload: true

  # 密钥管理
  key_management:
    # 密钥存储
    storage:
      type: "env"  # env / file / vault / aws_kms / azure_keyvault / gcp_kms

      # 环境变量方式
      env_config:
        master_key_var: "ENCRYPTION_MASTER_KEY"
        validation: true

      # 文件方式（仅开发环境）
      file_config:
        key_file_path: "/etc/context-keeper/keys/master.key"
        permissions: "0600"

      # Vault 方式（推荐生产环境）
      vault_config:
        enabled: false
        vault_url: "https://vault.example.com"
        vault_token: "${VAULT_TOKEN}"
        secret_path: "secret/context-keeper/keys"

    # 密钥轮换
    rotation:
      enabled: true
      rotation_interval_days: 90
      keep_old_keys_count: 3        # 保留最近3个旧密钥（用于解密旧数据）
      auto_reencrypt: true          # 自动用新密钥重新加密

    # 密钥层次结构
    key_hierarchy:
      use_master_key: true
      master_key_encrypts_data_keys: true
      data_key_per_tenant: true     # 每个租户独立数据密钥

  # 哈希算法
  hashing:
    # 密码哈希
    password:
      algorithm: "bcrypt"           # bcrypt / argon2 / scrypt
      bcrypt_cost: 12               # Work factor

      # Argon2 配置（备选）
      argon2_config:
        type: "argon2id"
        memory_cost_kb: 65536       # 64 MB
        time_cost: 3
        parallelism: 4

    # 通用哈希
    general:
      algorithm: "SHA-256"
      include_salt: true
      salt_length_bytes: 32

  # 安全随机数生成
  random_generation:
    algorithm: "CSPRNG"             # 密码学安全的伪随机数生成器
    sources:
      - "/dev/urandom"
      - "system_entropy"

# ============================================
# 六、审计日志 (Audit Logging)
# ============================================
audit_logging:
  enabled: true
  description: "安全相关操作的审计日志"

  # 记录的事件类型
  events:
    - "authentication_success"
    - "authentication_failure"
    - "authorization_failure"
    - "sensitive_data_access"
    - "sensitive_data_redaction"
    - "api_key_created"
    - "api_key_revoked"
    - "password_changed"
    - "permission_changed"
    - "security_rule_triggered"
    - "rate_limit_exceeded"
    - "encryption_key_rotated"

  # 日志格式
  format: "json"

  # 日志存储
  storage:
    backend: "file"  # file / database / syslog / elasticsearch
    file_path: "/var/log/context-keeper/audit.log"
    rotation:
      enabled: true
      max_size_mb: 100
      max_files: 10
      compress: true

  # 日志保留
  retention:
    days: 365  # 保留1年
    compliance: "GDPR"  # GDPR / SOC2 / ISO27001

# ============================================
# 七、环境配置 (Environment Profiles)
# ============================================
environments:
  # 开发环境
  development:
    sensitive_detection:
      enabled: true
      ai_detection:
        enabled: false  # 开发环境关闭 AI 检测节省资源
    redaction_levels:
      default: "minimal_redaction"  # 开发环境使用最小脱敏
    jwt_settings:
      token_lifetime:
        access_token:
          expiration_minutes: 60  # 开发环境 Token 有效期更长
    rate_limiting:
      enabled: false  # 开发环境关闭限流
    encryption:
      data_encryption:
        in_transit:
          enforce_https: false  # 开发环境允许 HTTP

  # 测试环境
  testing:
    sensitive_detection:
      enabled: true
    redaction_levels:
      default: "partial_redaction"
    jwt_settings:
      token_lifetime:
        access_token:
          expiration_minutes: 30
    rate_limiting:
      enabled: true
      per_user:
        requests_per_minute: 1000  # 测试环境放宽限制
    encryption:
      data_encryption:
        at_rest:
          enabled: true
        in_transit:
          enforce_https: true

  # 生产环境
  production:
    sensitive_detection:
      enabled: true
      ai_detection:
        enabled: true
    redaction_levels:
      default: "full_redaction"  # 生产环境使用完全脱敏
    jwt_settings:
      token_lifetime:
        access_token:
          expiration_minutes: 15
      refresh_strategy:
        refresh_token_rotation:
          enabled: true
    rate_limiting:
      enabled: true
      # 使用默认的严格限流配置
    encryption:
      data_encryption:
        at_rest:
          enabled: true
        in_transit:
          enforce_https: true
          tls_version: "1.3"
    audit_logging:
      enabled: true
      retention:
        days: 730  # 生产环境保留2年

# ============================================
# 八、合规性配置 (Compliance)
# ============================================
compliance:
  # GDPR 配置
  gdpr:
    enabled: true
    data_retention_days: 730
    right_to_erasure: true
    data_portability: true

  # SOC 2 配置
  soc2:
    enabled: false
    access_logging: true
    encryption_required: true

  # 数据驻留
  data_residency:
    enabled: false
    allowed_regions: ["cn-north", "cn-south"]

  # 隐私保护
  privacy:
    anonymization_required: true
    pseudonymization: true
    consent_management: true

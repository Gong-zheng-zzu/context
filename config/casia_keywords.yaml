# CASIA 上下文关键词权重表（外部可配置版本）
#
# 用途：供 ContextAwareSensitiveInfoAlgorithm 在显式加载时覆盖内置默认关键词权重，
#       便于在不改代码的前提下版本化调整上下文关键词与权重。
#
# 重要边界：
#   - 本文件内容为「人工配置 + 离线开发集校准前的固定基线」，不声称来自在线学习或自适应训练。
#   - 内置默认值（initContextKeywords）与本文件逐项一致，作为文件缺失/非法时的回退。
#   - 正权重增强对应敏感类型的上下文，负权重抑制误判。
#
# 加载：security.LoadCASIAConfigFromFile / NewContextAwareSensitiveInfoAlgorithmFromFile

version: casia-context-v1
context_window_bytes: 64
decision_threshold: 0.6

keyword_weights:
  # 身份证相关上下文
  id_card:
    身份证: 1.0
    证件号: 0.9
    身份证号: 1.0
    居民身份证: 1.0
    证件: 0.7
    实名: 0.6
    邮编: -0.8
    邮政编码: -0.8
    区号: -0.7

  # 手机号相关上下文
  phone:
    手机: 1.0
    电话: 0.9
    联系方式: 0.8
    手机号: 1.0
    电话号码: 0.9
    联系电话: 0.9
    QQ: -0.5
    工号: -0.6
    编号: -0.5

  # 病历号相关上下文
  medical_record:
    病历: 1.0
    病历号: 1.0
    就诊: 0.8
    住院: 0.8
    门诊: 0.7
    病案: 0.9
    医疗: 0.6
    处方: 0.7
    订单号: -0.7
    快递单号: -0.8

  # 血压相关上下文
  blood_pressure:
    血压: 1.0
    高压: 0.8
    低压: 0.8
    收缩压: 0.9
    舒张压: 0.9
    测量: 0.6
    体检: 0.7
    比例: -0.6
    分数: -0.7
    得分: -0.6
